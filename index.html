<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player — Phase 1</title>
    <style>
        /* ============================================
     DESIGN TOKENS
     Keep every color/spacing decision here so the
     whole look can be re-themed by editing this block.

     Note: player-core.js keeps its OWN copy of these same
     values for its Shadow DOM (see the comment at the top
     of that file for why) — if you change the palette here,
     change it there too.
     ============================================ */
        :root {
            --bg: #12161B;
            --panel: #1B2128;
            --panel-2: #232A32;
            --line: #2B333C;
            --text: #E8ECEF;
            --text-dim: #8B95A1;
            --accent: #4FD1C5;
            --accent-dim: #2E8F86;
            --danger: #E0685A;
            --radius: 10px;
            --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: 100%;
            max-width: 860px;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin: 0;
        }

        /* ============================================
     SOURCE LOADER
     Two ways in: pick a local file, or paste a URL. This
     part is specific to the standalone page — the userscript
     doesn't need it, since it attaches to videos the host
     page already loaded.
     ============================================ */
        .loader {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .loader input[type="text"] {
            flex: 1;
            min-width: 180px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text);
            padding: 10px 12px;
            font-family: var(--sans);
            font-size: 13px;
        }

        .loader input[type="text"]::placeholder {
            color: var(--text-dim);
        }

        .btn {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text);
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            font-family: var(--sans);
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent-dim);
        }

        .btn.primary {
            background: var(--accent);
            color: #0A1412;
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn.primary:hover {
            background: #63DBD0;
        }

        label.file-btn {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
        }

        label.file-btn:hover {
            border-color: var(--accent-dim);
        }

        input[type="file"] {
            display: none;
        }

        /* ============================================
     PLAYER STAGE
     Just the video + empty-state message. All the actual
     controls are injected into here by player-core.js.
     ============================================ */
        .stage {
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="app">
        <header>
            <h1>Custom Player — Phase 1</h1>
        </header>

        <!-- SOURCE LOADER -->
        <div class="loader">
            <label class="file-btn">
                Choose file
                <input type="file" id="fileInput" accept="video/*" />
            </label>
            <input type="text" id="urlInput" placeholder="…or paste a video URL" />
            <button class="btn primary" id="loadUrlBtn">Load URL</button>
        </div>

        <!-- STAGE — player-core.js appends the actual controls in here as
             a child of this div (it's position:relative and already
             contains the video), and uses it as the real fullscreen target. -->
        <div class="stage">
            <video id="video" playsinline></video>
            <div class="empty-state" id="emptyState">Load a video file or paste a URL above to get started</div>
        </div>
    </div>

    <script src="player-core.js"></script>
    <script>
        // ============================================
        // STANDALONE-PAGE GLUE
        // Only what's specific to this page: wiring the file/URL loader,
        // and handing the video off to the shared engine. Everything about
        // the player itself (controls, shortcuts, loop, export...) lives in
        // player-core.js so the exact same code runs in the userscript.
        // ============================================
        const video = document.getElementById('video');
        const stage = document.querySelector('.stage');
        const emptyState = document.getElementById('emptyState');
        const fileInput = document.getElementById('fileInput');
        const urlInput = document.getElementById('urlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            video.src = URL.createObjectURL(file);
            onSourceLoaded();
        });

        loadUrlBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) return;
            video.src = url;
            onSourceLoaded();
        });

        function onSourceLoaded() {
            emptyState.style.display = 'none';
            video.play().catch(() => { }); // autoplay can be blocked; that's fine
        }

        // A real container (.stage) is available here, so this uses real
        // native fullscreen and never needs the position-tracking fallback.
        initCustomPlayer(video, { container: stage });
    </script>

</body>

</html>
